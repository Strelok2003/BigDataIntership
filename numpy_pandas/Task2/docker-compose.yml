services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

    volumes:
      - ./data:/data
      - ./init:/init

    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr &
      sleep 20 &&
      /opt/mssql-tools18/bin/sqlcmd \
        -S localhost \
        -U sa \
        -P '${SA_PASSWORD}' \
        -C \
        -i /init/init.sql &&
      wait
      "