name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - alert_project/**
      - .github/workflows/ci.yml

  push:
    branches: [main]
    paths:
      - alert_project/**
      - .github/workflows/ci.yml

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alert_project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-root

      # -------------------
      # Ruff (format check)
      # -------------------
      - name: Quality
        run: make quality
